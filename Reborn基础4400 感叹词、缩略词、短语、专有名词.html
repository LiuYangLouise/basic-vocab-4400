html,body { height:100%; overflow:hidden; }
body { background:linear-gradient(165deg,#f0f7e9 0%,#deecd2 100%); }
#homePage { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:2rem 1rem; overflow-y:auto; -webkit-overflow-scrolling:touch; transition:transform .5s cubic-bezier(.65,0,.35,1); }

.home-btn:hover { background:#eef9e6; border-color:#9abb90; transform:translateY(-2px); }
.home-btn:active { transform:translateY(0); }
.home-btn .badge { display:block; font-size:.68rem; background:#c3ddb6; border-radius:20px; padding:.1rem .45rem; margin:.25rem auto 0; color:#23522e; font-weight:400; width:fit-content; }
.part-page { position:fixed; inset:0; z-index:100; background:linear-gradient(165deg,#f0f7e9 0%,#deecd2 100%); transform:translateX(100%); transition:transform .5s cubic-bezier(.65,0,.35,1); overflow-y:auto; -webkit-overflow-scrolling:touch; padding:1.5rem 1rem 2rem 1rem; }

.part-inner { max-width:620px; width:100%; margin:0 auto; }

.back-btn:active { transform:scale(.96); }
.header { margin-bottom:1.5rem; text-align:center; }

.header .sub1 { font-size:1.5rem; color:#4f7b5a; font-weight:340; line-height:1.4; }
.header .sub2 { font-size:1.2rem; color:#618967; font-weight:300; line-height:1.4; }
.header .sub3 { font-size:.9rem; color:#7a9f7e; font-weight:300; margin-top:.2rem; }
.chapter-scroll { overflow-x:auto; white-space:nowrap; -webkit-overflow-scrolling:touch; padding:.2rem 0 .4rem 0; scrollbar-width:none; }
.chapter-scroll::-webkit-scrollbar { display:none; }
.chap-flex { display:inline-flex; gap:.7rem; padding:0 .2rem; }
.chap-btn { background:#f3fcee; border:1px solid #d2e2c7; border-radius:40px; padding:.6rem 1.8rem; font-size:1.2rem; font-weight:430; color:#2b5538; white-space:nowrap; box-shadow:0 2px 6px rgba(150,180,140,.08); cursor:pointer; }
.chap-btn.active { background:#cde5c2; border-color:#8bb282; color:#1b4125; font-weight:500; }
.subchapter-scroll { overflow-x:auto; white-space:nowrap; -webkit-overflow-scrolling:touch; padding:0 0 .4rem 0; scrollbar-width:none; }
.subchapter-scroll::-webkit-scrollbar { display:none; }
.sub-flex { display:inline-flex; gap:.6rem; padding:0 .2rem; }
.sub-btn { background:#ecf7e4; border:1px solid #cde0c0; border-radius:30px; padding:.4rem 1.3rem; font-size:.96rem; font-weight:400; color:#336941; white-space:nowrap; box-shadow:0 1px 4px rgba(120,150,100,.1); cursor:pointer; }
.sub-btn.active-sub { background:#d4ebc5; border-color:#9abb90; color:#1e4529; font-weight:460; }
.unit-scroll { overflow-x:auto; white-space:nowrap; -webkit-overflow-scrolling:touch; padding:0 0 .8rem 0; scrollbar-width:none; }
.unit-scroll::-webkit-scrollbar { display:none; }
.unit-flex { display:inline-flex; gap:.5rem; padding:0 .2rem; }

.unit-btn.active-unit { background:#d0e8c2; border-color:#9ec092; color:#1a4024; font-weight:460; }

.flipper { position:relative; width:100%; height:auto; transition:transform .4s ease; transform-style:preserve-3d; }
.flipper.flipped { transform:rotateY(180deg); }
.front,.back { backface-visibility:hidden; -webkit-backface-visibility:hidden; position:relative; top:0; left:0; width:100%; border-radius:42px; padding:2.2rem 1.2rem; background:#fcfff8; border:1px solid #e3f0da; box-shadow:0 10px 20px rgba(130,160,120,.1); display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:220px; }
.back { position:absolute; transform:rotateY(180deg); min-height:220px; }
.en-word { font-size:2.8rem; font-weight:370; color:#1c4a2a; line-height:1.3; word-break:break-word; text-align:center; width:100%; }
.ph-word { font-size:1rem; color:#7a9f7e; font-weight:340; margin-top:.3rem; text-align:center; width:100%; }

.ch-word { font-size:1.6rem; font-weight:340; color:#316a42; margin-top:.6rem; text-align:center; width:100%; }
.nav-row { display:flex; align-items:center; justify-content:center; gap:.8rem; margin:1.2rem 0 1.8rem 0; flex-wrap:wrap; }
.nav-btn { background:#f1fde9; border:1px solid #cde0c3; border-radius:60px; padding:.6rem 1.5rem; font-size:1.1rem; color:#295e36; box-shadow:0 2px 6px rgba(0,0,0,.02); cursor:pointer; }
.thumb-header { display:flex; justify-content:space-between; align-items:center; margin:1rem 0 .8rem; flex-wrap:wrap; gap:.5rem; }
.thumb-header span { font-size:1.1rem; color:#3d6d4b; font-weight:330; }
.thumb-header .actions { display:flex; gap:.4rem; align-items:center; flex-wrap:wrap; }
.thumb-header .actions button { background:#dbeace; border:1px solid #adc9a2; border-radius:40px; padding:.3rem 1.1rem; font-size:.9rem; color:#23562f; cursor:pointer; white-space:nowrap; }
.thumb-grid-container { max-height:280px; overflow-y:auto; -webkit-overflow-scrolling:touch; border-radius:20px; padding:.2rem .2rem .5rem .2rem; }
.thumb-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:.5rem; padding:.2rem; }
.thumb-item { background:#f9fff3; border:1px solid #dbefd0; border-radius:24px; padding:.6rem .2rem .6rem .5rem; display:flex; align-items:center; gap:.2rem; box-shadow:0 2px 6px rgba(160,180,140,.1); min-width:0; }

.thumb-item label { font-size:.85rem; color:#2e623d; font-weight:420; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; cursor:pointer; }
.tip { color:#799e7a; font-size:.9rem; margin-top:.8rem; text-align:center; }

.go-home {

  padding: 8px 18px;

  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all .2s;
}
.go-home:hover { background: #eef9e6; transform: translateY(-1px); }
.go-home:active { transform: scale(.96); }

const homeButtons = document.getElementById('homeButtons');
const PART_NAMES = ['感叹词', '缩略词', '短语', '专有名词'];

function countWords(part){
  let n = 0;
  const data = VOCAB_DATA[part];
  if (!data) return 0;
  Object.values(data).forEach(theme => {
    Object.values(theme.units).forEach(arr => { n += arr.length; });
  });
  return n;
}

[1,2,3,4].forEach(part => {
  const btn = document.createElement('button');
  btn.className = 'home-btn';
  btn.innerHTML = `${PART_NAMES[part-1]} <span class="badge">${countWords(part)} 词</span>`;
  btn.addEventListener('click', () => openPart(part));
  homeButtons.appendChild(btn);
});

const PART_STATE = {};

function buildPartPage(part){
  const data = VOCAB_DATA[part];
  if (!data) {
    const inner = document.getElementById('partInner' + part);
    inner.innerHTML = '<button class="back-btn" data-back="' + part + '">← 返回主页</button><p style="text-align:center;padding:2rem;color:#799e7a;">数据整理中</p>';
    inner.querySelector('[data-back]').addEventListener('click', () => closePart(part));
    return;
  }
  const themeList = Object.keys(data);
  const unitMap = {};
  const allVocab = [];

  themeList.forEach(theme => {
    const unitNames = Object.keys(data[theme].units);
    unitMap[theme] = unitNames;
    unitNames.forEach(unitName => {
      data[theme].units[unitName].forEach(w => {
        allVocab.push({ ...w, theme, unit:unitName });
      });
    });
  });

  const state = {
    part, themeList, unitMap, allVocab,
    currentTheme: themeList[0],
    currentUnit: unitMap[themeList[0]][0],
    currentIndex: 0,
    difficultSet: new Set(),
    currentWords: []
  };
  state.currentWords = allVocab.filter(w => w.theme === state.currentTheme && w.unit === state.currentUnit);
  PART_STATE[part] = state;

  const inner = document.getElementById('partInner' + part);
  inner.innerHTML = `
    <button class="back-btn" data-back="${part}">← 返回主页</button>
    <div class="header">
      <h1>Reborner 基础核心词汇</h1>
      <div class="sub1">其他 · ${PART_NAMES[part-1]}</div>
      <div class="sub2">其他全量版</div>
      <div class="sub3">📂 ${themeList.length} 大主题 · ${Object.values(unitMap).reduce((a,b)=>a+b.length,0)} 个单元 · 共 ${allVocab.length} 个词条</div>
    </div>
    <div class="chapter-scroll"><div class="chap-flex"><button class="chap-btn active">${PART_NAMES[part-1]}</button></div></div>
    <div class="subchapter-scroll"><div class="sub-flex" id="subFlex${part}"></div></div>
    <div class="unit-scroll"><div class="unit-flex" id="unitFlex${part}"></div></div>
    <div class="flip-container">
      <div class="flipper" id="flipper${part}">
        <div class="front"><div class="en-word" id="mainEn${part}">—</div></div>
        <div class="back">
          <div class="en-word" id="backEn${part}">—</div>
          <div class="ph-word" id="phInfo${part}"></div>
          <div class="pos" id="posInfo${part}"></div>
          <div class="ch-word" id="mainCh${part}"></div>
        </div>
      </div>
    </div>
    <div class="nav-row">
      <button class="nav-btn" data-act="prev" data-p="${part}">← 前</button>
      <button class="nav-btn" data-act="next" data-p="${part}">后 →</button>
      <button class="nav-btn" data-act="speak" data-p="${part}">🔊 发音</button>
    </div>
    <div class="thumb-header">
      <span>📌 当前单元词汇 · 勾选难词</span>
      <div class="actions">
        <button class="select-all-btn" data-act="all" data-p="${part}">✅ 全选</button>
        <button class="select-all-btn" data-act="none" data-p="${part}">⬜ 取消</button>
        <button data-act="export" data-p="${part}">📎 导出难词</button>
      </div>
    </div>
    <div class="thumb-grid-container"><div class="thumb-grid" id="thumbGrid${part}"></div></div>
    <div class="tip">✓ 点击卡片翻转 · 勾选方格标记难词</div>
  `;

  inner.querySelector('[data-back]').addEventListener('click', () => closePart(part));
  inner.querySelectorAll('[data-act]').forEach(b => {
    b.addEventListener('click', () => handleAction(b.dataset.act, part));
  });
  document.getElementById('flipper' + part).addEventListener('click', function(){
    this.classList.toggle('flipped');
  });

  renderThemes(part);
  renderUnits(part);
  renderCard(part);
  renderThumbs(part);
}

function renderThemes(part){
  const s = PART_STATE[part];
  if (!s) return;
  const box = document.getElementById('subFlex' + part);
  box.innerHTML = '';
  s.themeList.forEach(theme => {
    const btn = document.createElement('button');
    btn.className = 'sub-btn' + (theme === s.currentTheme ? ' active-sub' : '');
    const cnt = s.allVocab.filter(w => w.theme === theme).length;
    btn.innerHTML = `${theme}<span class="word-count-badge">${cnt}</span>`;
    btn.addEventListener('click', () => {
      s.currentTheme = theme;
      s.currentUnit = s.unitMap[theme][0];
      renderThemes(part); renderUnits(part);
      s.currentWords = s.allVocab.filter(w => w.theme === s.currentTheme && w.unit === s.currentUnit);
      s.currentIndex = 0;
      renderCard(part); renderThumbs(part);
    });
    box.appendChild(btn);
  });
}

function renderUnits(part){
  const s = PART_STATE[part];
  if (!s) return;
  const box = document.getElementById('unitFlex' + part);
  box.innerHTML = '';
  s.unitMap[s.currentTheme].forEach(unitName => {
    const btn = document.createElement('button');
    btn.className = 'unit-btn' + (unitName === s.currentUnit ? ' active-unit' : '');
    const cnt = s.allVocab.filter(w => w.theme === s.currentTheme && w.unit === unitName).length;
    btn.innerHTML = `${unitName}<span class="word-count-badge">${cnt}</span>`;
    btn.addEventListener('click', () => {
      s.currentUnit = unitName;
      s.currentWords = s.allVocab.filter(w => w.theme === s.currentTheme && w.unit === unitName);
      s.currentIndex = 0;
      renderUnits(part); renderCard(part); renderThumbs(part);
    });
    box.appendChild(btn);
  });
}

function renderCard(part){
  const s = PART_STATE[part];
  if (!s) return;
  const mainEn = document.getElementById('mainEn' + part);
  const backEn = document.getElementById('backEn' + part);
  const phInfo = document.getElementById('phInfo' + part);
  const posInfo = document.getElementById('posInfo' + part);
  const mainCh = document.getElementById('mainCh' + part);
  const flipper = document.getElementById('flipper' + part);
  flipper.classList.remove('flipped');

  if (!s.currentWords.length) {
    mainEn.textContent = '无'; backEn.textContent = '';
    phInfo.textContent = ''; posInfo.textContent = ''; mainCh.textContent = '';
    return;
  }
  const w = s.currentWords[s.currentIndex];
  mainEn.textContent = w.en; backEn.textContent = w.en;
  phInfo.textContent = w.ph ? '/' + w.ph + '/' : '';
  posInfo.textContent = w.posLabel || w.pos || '';
  mainCh.textContent = w.ch;
  speak(w.en);
}

function renderThumbs(part){
  const s = PART_STATE[part];
  if (!s) return;
  const box = document.getElementById('thumbGrid' + part);
  box.innerHTML = '';
  s.currentWords.forEach((w, idx) => {
    const key = w.en + '|' + w.ch;
    const card = document.createElement('div');
    card.className = 'thumb-item';
    card.innerHTML = `<input type="checkbox" class="diff-check" data-key="${key.replace(/"/g,'&quot;')}" ${s.difficultSet.has(key)?'checked':''}><label>${w.en}</label>`;
    card.addEventListener('click', e => {
      if (e.target.tagName !== 'INPUT') { s.currentIndex = idx; renderCard(part); }
    });
    const chk = card.querySelector('.diff-check');
    chk.addEventListener('change', e => {
      e.stopPropagation();
      const k = e.target.dataset.key;
      if (e.target.checked) s.difficultSet.add(k); else s.difficultSet.delete(k);
    });
    box.appendChild(card);
  });
}

function handleAction(act, part){
  const s = PART_STATE[part];
  if (!s) return;
  if (act === 'prev') {
    if (!s.currentWords.length) return;
    s.currentIndex = (s.currentIndex - 1 + s.currentWords.length) % s.currentWords.length;
    renderCard(part);
  } else if (act === 'next') {
    if (!s.currentWords.length) return;
    s.currentIndex = (s.currentIndex + 1) % s.currentWords.length;
    renderCard(part);
  } else if (act === 'speak') {
    if (s.currentWords[s.currentIndex]) speak(s.currentWords[s.currentIndex].en);
  } else if (act === 'all') {
    document.querySelectorAll('#thumbGrid' + part + ' .diff-check').forEach(c => {
      c.checked = true; s.difficultSet.add(c.dataset.key);
    });
  } else if (act === 'none') {
    document.querySelectorAll('#thumbGrid' + part + ' .diff-check').forEach(c => {
      c.checked = false; s.difficultSet.delete(c.dataset.key);
    });
  } else if (act === 'export') {
    exportCsv(part);
  }
}

function exportCsv(part){
  const s = PART_STATE[part];
  if (!s) return;
  const selected = s.allVocab.filter(v => s.difficultSet.has(v.en + '|' + v.ch));
  if (!selected.length) { alert('没有勾选难词'); return; }
  const seen = new Set();
  let csv = '英文,音标,词性,中文含义,主题,单元\n';
  selected.forEach(w => {
    const key = w.en;
    if (seen.has(key)) return;
    seen.add(key);
    csv += `"${w.en}","${w.ph||''}","${w.posLabel||w.pos||''}","${w.ch}","${w.theme}","${w.unit}"\n`;
  });
  const blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8;'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `basic_${PART_NAMES[part-1]}_difficult.csv`;
  link.click();
}

function openPart(part){
  if (!PART_STATE[part]) buildPartPage(part);
  const home = document.getElementById('homePage');
  const page = document.getElementById('partPage' + part);
  home.classList.add('slide-left');
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      page.classList.add('slide-in');
      page.scrollTop = 0;
    });
  });
}
function closePart(part){
  const home = document.getElementById('homePage');
  const page = document.getElementById('partPage' + part);
  page.classList.remove('slide-in');
  home.classList.remove('slide-left');
}

function speak(text){
  if (window.parent && window.parent !== window) {
    try {
      window.parent.postMessage({ type: 'speak', text: text }, '*');
      return;
    } catch(e) {}
  }
  if ('speechSynthesis' in window) {
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }
}
</script>
